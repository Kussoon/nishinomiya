<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8f7ff">
<title>コミュニティ選択｜西宮市町名記憶ゲーム</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#e8f7ff;color:#15324a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(#e8f7ff,#fff)}
.back{display:inline-block;margin-bottom:8px;padding:8px 11px;border:1px solid #bad9e7;border-radius:10px;background:#fff;color:#245b7d;text-decoration:none;font-size:13px;font-weight:900}h1{margin:4px 0 3px;text-align:center;color:#155189;font-size:clamp(26px,7vw,36px);line-height:1.15}.lead{margin:0 0 10px;text-align:center;color:#55758a;font-size:15px;font-weight:800;line-height:1.5}.card{padding:10px;background:#fff;border:1px solid #bdddea;border-radius:18px;box-shadow:0 4px 15px #1f55731a}#map{--label-font-size:clamp(7px,1.8vw,10px);--label-pad-y:1px;--label-pad-x:3px;--label-radius:4px;--label-shadow-y:1px;--label-shadow-blur:3px;height:min(72dvh,720px);min-height:520px;border-radius:14px;background:#dfeaf1}.map-status{height:100%;display:flex;align-items:center;justify-content:center;color:#60758a;font-weight:800}.community-label{border:0!important;background:#ffffffdf!important;color:#17385e!important;border-radius:var(--label-radius)!important;padding:var(--label-pad-y) var(--label-pad-x)!important;box-shadow:0 var(--label-shadow-y) var(--label-shadow-blur) #17385e55!important;font-size:var(--label-font-size)!important;font-weight:900!important;line-height:1.15!important;white-space:nowrap!important}.community-label:before{display:none!important}.message{margin:10px 2px 2px;text-align:center;color:#39708f;font-size:14px;font-weight:850;line-height:1.5}.map-credit{margin:12px 2px 0;padding-top:10px;border-top:1px solid #cad8e3;color:#657786;font-size:9px;line-height:1.55}.footer{margin-top:14px;text-align:center;color:#66808e;font-size:11px;line-height:1.5}
</style>
</head>
<body><main class="app">
<a class="back" href="index.html">← トップページ</a>
<h1>コミュニティを選択</h1>
<p class="lead">地図から挑戦するコミュニティをタップしてください。</p>
<section class="card"><div id="map" aria-label="西宮市26コミュニティ選択地図"><div class="map-status">地図を読み込んでいます…</div></div><p id="message" class="message">現在は「芦原」「瓦木」「名塩」「山口」を選択できます。</p></section>
<p class="map-credit">地図境界データ：『国勢調査町丁・字等別境界データセット』（CODH作成）「令和2年国勢調査町丁・字等別境界データ」（e-Stat）を加工。CC BY 4.0／doi:10.20676/00000450<br>コミュニティ区分：平成15年度西宮市市民自然調査結果報告「コミュニティ町名一覧」を参考に独自作成。</p>
<footer class="footer">© KUSSOON 2026 All Rights Reserved.</footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const map=L.map('map',{attributionControl:false,zoomControl:true,dragging:true,touchZoom:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:false,keyboard:true,zoomSnap:.1});
const mapElement=document.getElementById('map');const baseLabelFontSize=Math.min(10,Math.max(7,window.innerWidth*.018));let initialLabelZoom;
function updateLabelScale(){if(initialLabelZoom===undefined)return;const scale=Math.min(3.5,Math.max(.72,Math.pow(1.35,map.getZoom()-initialLabelZoom)));mapElement.style.setProperty('--label-font-size',`${baseLabelFontSize*scale}px`);mapElement.style.setProperty('--label-pad-y',`${scale}px`);mapElement.style.setProperty('--label-pad-x',`${3*scale}px`);mapElement.style.setProperty('--label-radius',`${4*scale}px`);mapElement.style.setProperty('--label-shadow-y',`${scale}px`);mapElement.style.setProperty('--label-shadow-blur',`${3*scale}px`)}
map.on('zoom zoomend',updateLabelScale);
const message=document.getElementById('message');
Promise.all([fetch('data/nishinomiya-towns.topojson').then(r=>r.json()),fetch('data/community-town-map.json').then(r=>r.json())]).then(([topology,mapping])=>{
 const geometries=topology.objects.town.geometries;
 const features=mapping.communities.map(community=>{const members=geometries.filter(g=>mapping.towns[g.properties.S_NAME]?.community===community);const merged=topojson.merge(topology,members);merged.properties={community};return merged;});
 const special=geometries.find(g=>g.properties.S_NAME==='岡田山');if(special){const f=topojson.feature(topology,special);f.properties={community:'岡田山'};features.push(f)}
 document.querySelector('.map-status')?.remove();
 const layer=L.geoJSON({type:'FeatureCollection',features},{
  style(f){const okada=f.properties.community==='岡田山';return{color:'#fff',weight:okada?1.4:2.2,fillColor:okada?'#ffd34d':'#5f87d8',fillOpacity:.88}},
  onEachFeature(f,shape){const name=f.properties.community;if(name==='岡田山')return;const offset=name==='上ヶ原'?L.point(15,10):L.point(0,0);shape.bindTooltip(name,{permanent:true,direction:'center',offset,className:'community-label',interactive:false});shape.on('click',()=>{const pages={芦原:'communities/01ashihara/',瓦木:'communities/04kawaragi/',名塩:'communities/16najio/',山口:'communities/25yamaguchi/'};if(pages[name])location.href=pages[name];else message.textContent=`「${name}」は順次追加します。現在は「芦原」「瓦木」「名塩」「山口」を選択できます。`;});}
 }).addTo(map);map.fitBounds(layer.getBounds(),{padding:[5,5],animate:false});initialLabelZoom=map.getZoom();updateLabelScale();setTimeout(()=>map.invalidateSize({animate:false}),0);
}).catch(()=>{message.textContent='地図を読み込めませんでした。データファイルを確認してください。'});
</script></body></html>
