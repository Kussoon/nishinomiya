  }).addTo(map);

  const normalIcon = L.divIcon({
    className: '',
    html: '<div style="width:12px;height:12px;border-radius:50%;background:#1f5fa8;border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,.4);"></div>',
    iconSize: [12,12],
    iconAnchor: [6,6]
  });
  const warnIcon = L.divIcon({
    className: '',
    html: '<div style="width:12px;height:12px;border-radius:50%;background:#e07b2a;border:2px solid white;box-shadow:0 0 2px rgba(0,0,0,.4);"></div>',
    iconSize: [12,12],
    iconAnchor: [6,6]
  });

  const markers = points.map(p => {
    const m = L.marker([p.lat, p.lon], {icon: p.conf === 'low' ? warnIcon : normalIcon});
    m.bindPopup(`<strong>${p.flag}${p.no}. ${p.name}</strong><br><span style="color:#5b6673;font-size:0.8em;">確認状況: ${p.conf === 'low' ? '推定位置（要確認）' : p.conf}</span>`);
    m.addTo(map);
    return {marker: m, data: p};
  });

  const listEl = document.getElementById('list');
  markers.forEach(({marker, data}) => {
    const div = document.createElement('div');
    div.className = 'item' + (data.conf === 'low' ? ' warn' : '');
    div.dataset.name = data.name;
    div.innerHTML = `<span class="no">${data.no}</span><span class="name">${data.flag}${data.name}</span>`;
    div.addEventListener('click', () => {
      map.setView([data.lat, data.lon], 17);
      marker.openPopup();
    });
    listEl.appendChild(div);
  });

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    document.querySelectorAll('.item').forEach(el => {
      el.classList.toggle('hidden', q && !el.dataset.name.includes(q));
    });
  });
