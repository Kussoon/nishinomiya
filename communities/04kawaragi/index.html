<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e8f7ff"><title>瓦木の町名を覚える｜西宮市 町名記憶ゲーム</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;background:#e8f7ff;color:#15324a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(#e8f7ff,#fff)}.back{display:inline-block;margin-bottom:8px;padding:8px 11px;border:1px solid #bad9e7;border-radius:10px;background:#fff;color:#245b7d;text-decoration:none;font-size:13px;font-weight:900}h1{margin:3px 0;text-align:center;color:#155189;font-size:clamp(29px,8vw,39px)}.lead{margin:0 0 10px;text-align:center;color:#55758a;font-size:15px;font-weight:800}.card{padding:10px;background:#fff;border:1px solid #bdddea;border-radius:18px;box-shadow:0 4px 15px #1f55731a}.map-title{margin:2px 0 8px;text-align:center;color:#155189;font-size:20px}#map{--label-font-size:10px;--label-pad-y:1px;--label-pad-x:3px;--label-radius:4px;--label-shadow-y:1px;--label-shadow-blur:3px;height:390px;border-radius:14px;background:#dfeaf1}.map-status{height:100%;display:flex;align-items:center;justify-content:center;color:#60758a;font-weight:800}.town-label{border:0!important;background:#ffffffdf!important;color:#17385e!important;border-radius:var(--label-radius)!important;padding:var(--label-pad-y) var(--label-pad-x)!important;box-shadow:0 var(--label-shadow-y) var(--label-shadow-blur) #17385e44!important;font-size:var(--label-font-size)!important;font-weight:900!important;line-height:1.15!important;white-space:nowrap!important}.town-label:before{display:none!important}.town-label{pointer-events:none!important}.modes{display:grid;gap:11px;margin-top:12px}.mode{width:100%;min-height:82px;padding:13px;border:0;border-radius:16px;background:#287dd7;color:#fff;text-align:left;font-size:18px;font-weight:950;box-shadow:0 5px 12px #287dd744}.mode:nth-child(2){background:#4aa86d}.mode small{display:block;margin-top:5px;font-size:13px;line-height:1.4;font-weight:750}.mode[disabled]{opacity:.72}.note{margin:9px 2px 0;text-align:center;color:#66808e;font-size:12px;font-weight:750}.map-credit{margin:12px 2px 0;padding-top:10px;border-top:1px solid #cad8e3;color:#657786;font-size:9px;line-height:1.55}.footer{margin-top:16px;text-align:center;color:#66808e;font-size:11px;line-height:1.5}.leaflet-control-zoom a{font-weight:900}
</style></head><body><main class="app"><a class="back" href="../../community-select.html">← コミュニティ選択へ</a><h1>瓦木の町名を覚える</h1><p class="lead">瓦木コミュニティの12町を覚えましょう。</p><section class="card"><h2 class="map-title">瓦木コミュニティ全図</h2><div id="map" aria-label="瓦木コミュニティ町別地図"><div class="map-status">地図を読み込んでいます…</div></div></section><section class="modes" aria-label="出題モード"><button class="mode" type="button" onclick="location.href='location-quiz.html'">📍 町名から場所を当てる<small>「中島町はどこ？」に対して地図をタップ</small></button><button class="mode" type="button" onclick="location.href='name-quiz.html'">✨ 光った場所の町名を当てる<small>強調された町域の名前を4択から選択</small></button></section><p class="note">どちらのモードも全12町を毎回ランダムに出題します。</p><p class="map-credit">地図境界データ：『国勢調査町丁・字等別境界データセット』（CODH作成）「令和2年国勢調査町丁・字等別境界データ」（e-Stat）を加工。CC BY 4.0／doi:10.20676/00000450<br>コミュニティ区分：平成15年度西宮市市民自然調査結果報告「コミュニティ町名一覧」を参考に独自作成。</p><footer class="footer">© KUSSOON 2026 All Rights Reserved.</footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script><script>
const map=L.map('map',{zoomControl:true,attributionControl:false,dragging:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:false,keyboard:true,touchZoom:true,zoomSnap:.1});
const mapElement=document.getElementById('map');let initialLabelZoom;
function updateLabelScale(){if(initialLabelZoom===undefined)return;const scale=Math.min(3.5,Math.max(.72,Math.pow(1.35,map.getZoom()-initialLabelZoom)));mapElement.style.setProperty('--label-font-size',`${10*scale}px`);mapElement.style.setProperty('--label-pad-y',`${scale}px`);mapElement.style.setProperty('--label-pad-x',`${3*scale}px`);mapElement.style.setProperty('--label-radius',`${4*scale}px`);mapElement.style.setProperty('--label-shadow-y',`${scale}px`);mapElement.style.setProperty('--label-shadow-blur',`${3*scale}px`)}
map.on('zoom zoomend',updateLabelScale);
Promise.all([fetch('../../data/nishinomiya-towns.topojson').then(r=>r.json()),fetch('../../data/community-town-map.json').then(r=>r.json())]).then(([topology,mapping])=>{const members=topology.objects.town.geometries.filter(g=>mapping.towns[g.properties.S_NAME]?.community==='瓦木');const collection=topojson.feature(topology,{type:'GeometryCollection',geometries:members});document.querySelector('.map-status')?.remove();const layer=L.geoJSON(collection,{interactive:false,style:{color:'#fff',weight:1.2,fillColor:'#5f87d8',fillOpacity:.92},onEachFeature(f,shape){shape.bindTooltip(f.properties.S_NAME,{permanent:true,direction:'center',className:'town-label',interactive:false})}}).addTo(map);map.fitBounds(layer.getBounds(),{padding:[3,3],animate:false});initialLabelZoom=map.getZoom();updateLabelScale();setTimeout(()=>map.invalidateSize({animate:false}),0)}).catch(()=>{document.querySelector('.map-status').textContent='地図を読み込めませんでした。'});
</script></body></html>
