<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e8f7ff"><title>夙川 町名から場所を当てる｜西宮市町名記憶ゲーム</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#e8f7ff}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#15324a;display:flex;justify-content:center}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(100vw,520px);min-height:100dvh;background:linear-gradient(#e8f7ff,#fff);position:relative}.screen{min-height:100dvh;padding:max(9px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.hidden{display:none!important}.topbar{display:grid;grid-template-columns:80px 1fr 68px;gap:6px;align-items:center}.smallbtn{border:1px solid #bad9e7;background:#fff;color:#245b7d;border-radius:10px;padding:9px 3px;font-size:11px;font-weight:900}.stage{padding:9px 4px;border-radius:10px;background:#287dd7;color:#fff;text-align:center;font-size:14px;font-weight:950}.stats{text-align:right;font-size:12px;font-weight:900;line-height:1.35}.question{padding:10px;border:1px solid #bdddea;border-radius:15px;background:#fff;text-align:center;box-shadow:0 3px 12px #1f55731a}.prompt{font-size:16px;font-weight:850;color:#55758a}.town{margin-top:3px;color:#153f6c;font-size:clamp(29px,9vw,42px);font-weight:950;line-height:1.15}.reading{margin-top:3px;color:#527489;font-size:20px;font-weight:900}.mapwrap{position:relative;flex:1;min-height:410px;border:1px solid #bdddea;border-radius:16px;background:#fff;padding:7px;overflow:hidden}#map{width:100%;height:100%;min-height:394px;border-radius:12px;background:#dfeaf1}.feedback{min-height:54px;padding:10px 12px;border:1px solid #bdddea;border-radius:13px;background:#fff;font-size:17px;font-weight:900;line-height:1.4}.good{color:#16713f}.bad{color:#aa3028}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.links a{display:flex;align-items:center;justify-content:center;min-height:38px;padding:5px 2px;border:1px solid #bddae7;border-radius:10px;background:#fff;color:#245b7d;text-decoration:none;text-align:center;font-size:11px;font-weight:900}.map-credit{margin:2px 1px 0;color:#657786;font-size:8px;line-height:1.45}.resulthead{padding:13px;border-radius:14px;background:#287dd7;color:#fff;text-align:center;font-size:23px;font-weight:950}.resultcard{margin:auto 0;padding:22px 14px;border:1px solid #bdddea;border-radius:18px;background:#fff;text-align:center;box-shadow:0 4px 15px #1f55731a}.outof{font-size:20px;font-weight:900;color:#155189}.score{margin:6px 0;color:#df4747;font-size:78px;line-height:1;font-weight:950}.mistakes{font-size:19px;font-weight:900}.comment{font-size:16px;line-height:1.5}.actions{display:grid;gap:8px}.action{width:100%;padding:13px;border:0;border-radius:12px;background:#287dd7;color:#fff;text-align:center;text-decoration:none;font-size:15px;font-weight:950}.action.secondary{border:1px solid #bddae7;background:#eef8fc;color:#235c7d}.leaflet-control-zoom a{font-weight:900}
</style></head><body><main class="app">
<section id="quiz" class="screen"><div class="topbar"><button id="quitBtn" class="smallbtn" type="button">ここでやめる</button><div class="stage">夙川・場所当て</div><div class="stats"><span id="progress">1 / 11</span><br>得点 <span id="scoreNow">11</span></div></div><div class="question"><div class="prompt">この町はどこ？</div><div id="town" class="town"></div><div id="reading" class="reading"></div></div><div class="mapwrap"><div id="map" aria-label="夙川コミュニティ町域選択地図"></div></div><div id="feedback" class="feedback">地図をタップしてください。</div><nav class="links"><a href="index.html">夙川トップ</a><a href="../../community-select.html">コミュニティ選択</a><a href="../../index.html">トップページ</a></nav><p class="map-credit">地図境界データ：『国勢調査町丁・字等別境界データセット』（CODH作成）「令和2年国勢調査町丁・字等別境界データ」（e-Stat）を加工。CC BY 4.0／doi:10.20676/00000450<br>コミュニティ区分：平成15年度西宮市市民自然調査結果報告「コミュニティ町名一覧」を参考に独自作成。</p></section>
<section id="result" class="screen hidden"><div class="resulthead">夙川・場所当て　結果</div><div class="resultcard"><div id="resultTotal" class="outof">11問中</div><div id="finalScore" class="score">11点</div><div id="mistakes" class="mistakes">誤タップ 0回</div><p id="comment" class="comment"></p></div><div class="actions"><button id="mistakeRetryBtn" class="action" type="button">間違えた問題にもう一度チャレンジ</button><button id="retryBtn" class="action" type="button">全11問にもう一度チャレンジ</button><a class="action secondary" href="index.html">夙川トップ</a><a class="action secondary" href="../../community-select.html">コミュニティ選択</a><a class="action secondary" href="../../index.html">トップページ</a></div></section>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script><script>
const READINGS={"大谷町":"おおたにちょう","御茶家所町":"おちゃやしょちょう","木津山町":"きずやまちょう","松園町":"まつぞのちょう","殿山町":"とのやまちょう","相生町":"あいおいちょう","羽衣町":"はごろもちょう","郷免町":"ごうめんちょう","雲井町":"くもいちょう","霞町":"かすみちょう","高塚町":"たかつかちょう"};
const map=L.map('map',{attributionControl:false,minZoom:9,maxZoom:19,zoomControl:true});let layers=[],order=[],index=0,score=17,wrong=0,locked=false,allBounds,missed=new Set();
const base={color:'#fff',weight:1.3,fillColor:'#5f87d8',fillOpacity:.9},correct={color:'#08743f',weight:2.4,fillColor:'#35c979',fillOpacity:.96},incorrect={color:'#a52121',weight:2.4,fillColor:'#ef6565',fillOpacity:.96};
const byId=id=>document.getElementById(id);function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function show(id){byId('quiz').classList.toggle('hidden',id!=='quiz');byId('result').classList.toggle('hidden',id!=='result')}
function loadQuestion(){locked=false;layers.forEach(x=>x.layer.setStyle(base));const name=order[index];byId('progress').textContent=`${index+1} / ${order.length}`;byId('scoreNow').textContent=score;byId('town').textContent=name;byId('reading').textContent=`（${READINGS[name]}）`;byId('feedback').className='feedback';byId('feedback').textContent='地図をタップしてください。'}
function answer(item){if(locked)return;const target=order[index];if(item.name===target){locked=true;item.layer.setStyle(correct);byId('feedback').className='feedback good';byId('feedback').textContent=`正解！ ここが「${target}」です。`;setTimeout(()=>{index++;if(index>=order.length)finish();else loadQuestion()},850)}else{wrong++;missed.add(target);score=Math.max(0,score-1);byId('scoreNow').textContent=score;item.layer.setStyle(incorrect);byId('feedback').className='feedback bad';byId('feedback').textContent=`そこは「${item.name}」です。もう一度探してください。`;setTimeout(()=>{if(!locked)item.layer.setStyle(base)},650)}}
function start(names){order=shuffle(names?.length?names:layers.map(x=>x.name));index=0;score=order.length;wrong=0;missed=new Set();show('quiz');setTimeout(()=>{map.invalidateSize();map.fitBounds(allBounds,{padding:[8,8]});loadQuestion()},0)}
function finish(){byId('resultTotal').textContent=`${order.length}問中`;byId('finalScore').textContent=`${score}点`;byId('mistakes').textContent=`誤タップ ${wrong}回`;byId('comment').textContent=score===order.length?'全問一発正解です！':score>=Math.ceil(order.length*.75)?'かなりよく覚えています！':'もう一度挑戦すると、さらに定着します。';byId('mistakeRetryBtn').hidden=missed.size===0;show('result')}
Promise.all([fetch('../../data/nishinomiya-towns.topojson').then(r=>r.json()),fetch('../../data/community-town-map.json').then(r=>r.json())]).then(([topology,mapping])=>{const members=topology.objects.town.geometries.filter(g=>mapping.towns[g.properties.S_NAME]?.community==='夙川');const groupName=name=>name.replace(/[一二三四五六七八九十]+丁目$/,'');const names=[...new Set(members.map(g=>groupName(g.properties.S_NAME)))];const features=names.map(name=>{const merged=topojson.merge(topology,members.filter(g=>groupName(g.properties.S_NAME)===name));merged.properties={S_NAME:name};return merged});const group=L.geoJSON({type:'FeatureCollection',features},{style:base,onEachFeature(f,layer){const item={name:f.properties.S_NAME,layer};layers.push(item);layer.on('click',()=>answer(item))}}).addTo(map);allBounds=group.getBounds();start()}).catch(()=>{byId('feedback').textContent='地図を読み込めませんでした。'});
byId('retryBtn').addEventListener('click',()=>start());byId('mistakeRetryBtn').addEventListener('click',()=>start([...missed]));byId('quitBtn').addEventListener('click',()=>location.href='index.html');
</script></body></html>
