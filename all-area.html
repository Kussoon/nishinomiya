<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e8f7ff">
  <title>白地図で町名を確認｜西宮市 町名記憶ゲーム</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#16365c;--blue:#2f75b5;--pale:#eaf4ff;--gold:#f4b942;--ink:#203040}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(#eef7ff,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}
    body{padding:env(safe-area-inset-top) 12px calc(18px + env(safe-area-inset-bottom))}
    .page{width:min(780px,100%);margin:auto}
    .back{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border-radius:999px;background:#fff;color:var(--navy);font-weight:800;text-decoration:none;box-shadow:0 2px 8px #16365c22}
    h1{margin:10px 0 2px;text-align:center;color:var(--navy);font-size:clamp(24px,6vw,36px)}
    .stage{text-align:center;color:var(--blue);font-weight:900;font-size:18px}
    .teacher{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;margin:10px 0}
    .teacher img{width:76px;height:76px;object-fit:cover;object-position:top;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 10px #16365c33}
    .speech{position:relative;background:#fff;border:2px solid #9bc9ef;border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.55;box-shadow:0 2px 8px #16365c18}
    .speech:before{content:"";position:absolute;left:-11px;top:27px;border-width:8px 11px 8px 0;border-style:solid;border-color:transparent #9bc9ef transparent transparent}
    .speech:after{content:"";position:absolute;left:-8px;top:29px;border-width:6px 9px 6px 0;border-style:solid;border-color:transparent white transparent transparent}
    .answer{min-height:64px;margin:8px 0;padding:8px 12px;border-radius:14px;background:var(--navy);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px #16365c33}
    .answer small{font-size:12px;opacity:.85}
    #townName{font-size:clamp(22px,6vw,34px);font-weight:900;line-height:1.2}.town-reading{font-size:inherit;font-weight:900;line-height:1.2}
    .town-community{min-height:1.35em;margin-top:5px;font-size:clamp(13px,3.6vw,17px);font-weight:800;line-height:1.35;opacity:.9}
    .town-community:empty{display:none}
    .answer-actions{display:flex;justify-content:center;margin:-1px 0 10px}
    .transport-toggle{min-height:44px;padding:9px 20px;border:2px solid #8fc5e2;border-radius:999px;background:#fff;color:var(--navy);font-size:16px;font-weight:900;box-shadow:0 3px 10px #16365c24;cursor:pointer}
    .transport-toggle:disabled{opacity:.58;cursor:wait}
    .map-wrap{position:relative;border:3px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #16365c33;background:#dfeaf1}
    #map{height:min(58vh,620px);min-height:420px;background:#dfeaf1;--transport-label-font-size:6.4px;--transport-label-pad-y:.7px;--transport-label-pad-x:1.5px;--transport-label-radius:2.5px;--station-label-font-size:5.8px}
    .tools{position:absolute;z-index:500;right:8px;top:8px;display:flex;gap:6px}
    .tools button{border:0;border-radius:10px;background:#fff;color:var(--navy);font-weight:900;padding:9px 11px;box-shadow:0 2px 8px #16365c33;cursor:pointer}
    .note{margin:10px 4px 0;font-size:13px;line-height:1.6;color:#526373}
    .credit{margin-top:14px;padding-top:10px;border-top:1px solid #cad8e3;font-size:10px;line-height:1.5;color:#657786}
    .footer{margin-top:14px;text-align:center;color:#66808e;font-size:11px}
    .leaflet-container{font:inherit;touch-action:pan-x pan-y}
    .leaflet-interactive.town-selected{fill:#fff1a6!important;fill-opacity:1!important;stroke:#d2a52b!important;stroke-width:2.5!important}
    .transport-label{border:0!important;border-radius:var(--transport-label-radius)!important;padding:var(--transport-label-pad-y) var(--transport-label-pad-x)!important;background:#fffef0e8!important;color:#6f4310!important;font-size:var(--transport-label-font-size)!important;font-weight:900!important;line-height:1!important;white-space:nowrap!important;box-shadow:0 .5px 1.5px #26384966!important;pointer-events:none!important}
    .transport-label:before{display:none!important}
    .transport-label.rail-label{background:#fff5f6e8!important;color:#6c1833!important}
    .transport-label.expressway-label{background:#f7f1ffe8!important;color:#593887!important}
    .station-label{border:1px solid #17385e66!important;border-radius:3px!important;padding:1px 2px!important;background:#fffffff2!important;color:#17385e!important;font-size:var(--station-label-font-size)!important;font-weight:900!important;line-height:1!important;white-space:nowrap!important;box-shadow:0 .5px 1.5px #26384955!important;pointer-events:none!important}
    .station-label:before{display:none!important}
    .town-tooltip{background:#16365c;color:white;border:0;border-radius:8px;font-weight:800;box-shadow:0 2px 8px #0003}
    .town-tooltip:before{border-top-color:#16365c}
    @media(max-width:480px){
      body{padding-left:8px;padding-right:8px}
      .teacher{grid-template-columns:62px 1fr}
      .teacher img{width:62px;height:62px}
      .speech{font-size:14px;padding:9px 11px}
      #map{height:55vh;min-height:390px}
    }
  </style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html">← ゲームトップへ</a>
  <h1>西宮市 町名記憶ゲーム</h1>
  <div class="stage">🌐 白地図で町名を確認</div>

  <section class="teacher">
    <img src="images/guide-character.png" alt="案内キャラクター">
    <div class="speech" id="message">気になる町を地図でタップしてください。</div>
  </section>

  <div class="answer" aria-live="polite">
    <small>選んだ町</small>
    <div id="townName"><div id="townMain">地図の町域をタップ</div><div id="townReading" class="town-reading"></div></div>
    <div id="townCommunity" class="town-community"></div>
  </div>
  <div class="answer-actions">
    <button class="transport-toggle" type="button" id="transportToggle" aria-pressed="false" disabled>交通入りで見る</button>
  </div>

  <div class="map-wrap">
    <div id="map" aria-label="西宮市の町別地図"></div>
    <div class="tools"><button type="button" id="resetView">全体表示</button></div>
  </div>

  <p class="note">通常モードでは、一丁目・二丁目などは同じ町名としてまとめています。</p>
  <p class="credit">地図境界データ：『国勢調査町丁・字等別境界データセット』（CODH作成）「令和2年国勢調査町丁・字等別境界データ」（e-Stat）を加工。CC BY 4.0／doi:10.20676/00000450<br>コミュニティ区分：平成15年度西宮市市民自然調査結果報告「コミュニティ町名一覧」を参考に独自作成。</p>
  <footer class="footer">© KUSSOON 2026 All Rights Reserved.</footer>
</main>

    {name:'国道43号',kind:'road',anchor:'west',direction:'left',offset:[-3,7]},
    {name:'国道43号',kind:'road',anchor:'east',direction:'right',offset:[3,7]},
    {name:'臨港線',kind:'road',anchor:'west',direction:'left'},
    {name:'臨港線',kind:'road',anchor:'east',direction:'right'},
    {name:'阪神高速5号湾岸線',kind:'expressway',anchor:'west',direction:'left'},
    {name:'阪神高速5号湾岸線',kind:'expressway',anchor:'east',direction:'right'}
  ];

  // 「一丁目」「二丁目」など、末尾が丁目のものだけをまとめる。
  // 「甲子園一番町」「苦楽園一番町」など正式町名中の数字は変更しない。
  function groupedName(name) {
    return String(name || '').replace(/[一二三四五六七八九十百]+丁目$/, '');
  }

  function rawName(geometry) {
    const p = geometry.properties || {};
    return p.S_NAME || p.s_name || p.MOJI || '町名不明';
  }

  function featureName(feature) {
    const p = feature.properties || {};
    return p.S_NAME || p.s_name || p.MOJI || '町名不明';
  }

  function featureCommunities(feature) {
    return feature.properties?.COMMUNITIES || [];
  }

  function geometryLines(geometry) {
    if (!geometry) return [];
    return geometry.type === 'LineString' ? [geometry.coordinates] : geometry.coordinates;
  }

  function transportLabelAnchor(transportData,label) {
    const endpoints = transportData.features
      .filter(feature => feature.properties?.name === label.name)
      .flatMap(feature => geometryLines(feature.geometry))
      .flatMap(line => line.length ? [line[0],line[line.length - 1]] : []);
    if (!endpoints.length) return null;
    const compare = {
      west:(a,b) => a[0] - b[0],
      east:(a,b) => b[0] - a[0],
      south:(a,b) => a[1] - b[1],
      north:(a,b) => b[1] - a[1]
    }[label.anchor];
    const point = [...endpoints].sort(compare)[0];
    return [point[1],point[0]];
  }

  function updateTransportLabelScale() {
    if (initialMapZoom === undefined) return;
    const scale = Math.min(5,Math.max(.72,Math.pow(1.35,map.getZoom() - initialMapZoom)));
    mapElement.style.setProperty('--transport-label-font-size',`${6.4 * scale}px`);
    mapElement.style.setProperty('--transport-label-pad-y',`${.7 * scale}px`);
    mapElement.style.setProperty('--transport-label-pad-x',`${1.5 * scale}px`);
    mapElement.style.setProperty('--transport-label-radius',`${2.5 * scale}px`);
    mapElement.style.setProperty('--station-label-font-size',`${5.8 * scale}px`);
  }

  map.on('zoom zoomend',updateTransportLabelScale);

  function chooseTown(feature, selectedLayer) {
    const name = featureName(feature);
    const communities = featureCommunities(feature);
    selectedName = name;
    townMain.textContent = name;
    townReading.textContent = READINGS[name] ? `（${READINGS[name]}）` : '';
    townCommunity.textContent = communities.length ? `${communities.join('・')}コミュニティ` : '';
    message.textContent = `ここは「${name}」です。`;
    townLayer.eachLayer(layer => {
      layer.setStyle(normalStyle);
      layer.getElement()?.classList.remove('town-selected');
    });
    selectedLayer.setStyle(selectedStyle);
    selectedLayer.getElement()?.classList.add('town-selected');
    selectedLayer.bringToFront();
  }

  async function toggleTransport() {
    if (transportGroup) {
      transportVisible = !transportVisible;
      if (transportVisible) transportGroup.addTo(map);
      else map.removeLayer(transportGroup);
      transportButton.textContent = transportVisible ? '白地図に戻る' : '交通入りで見る';
      transportButton.setAttribute('aria-pressed', String(transportVisible));
      if (transportVisible) updateTransportLabelScale();
      return;
    }

    transportButton.disabled = true;
    transportButton.textContent = '交通を読み込んでいます…';
    try {
      const [transportResponse,waterResponse,correctionsResponse,stationsResponse] = await Promise.all([
        fetch('data/nishinomiya-transport.geojson?v=6.5.186'),
        fetch('data/nishinomiya-water.geojson'),
        fetch('data/nishinomiya-transport-corrections.geojson?v=6.5.186'),
        fetch('data/nishinomiya-stations.geojson?v=6.5.186')
      ]);
      if (!transportResponse.ok || !waterResponse.ok || !correctionsResponse.ok || !stationsResponse.ok) throw new Error('交通データを読み込めませんでした');
      const [transportData,waterData,transportCorrections,stationData] = await Promise.all([
        transportResponse.json(),waterResponse.json(),correctionsResponse.json(),stationsResponse.json()
      ]);
      transportData.features.push(...transportCorrections.features);
      const railColors = {
        '阪急神戸線':'#7b1e3a',
        '阪急今津線':'#7b1e3a',
        '阪急甲陽線':'#7b1e3a',
        'JR神戸線':'#178447',
        'JR福知山線':'#178447',
        '阪神本線':'#e26b22',
        '阪神武庫川線':'#e26b22'
      };
      const transportLayers = [
        L.geoJSON(waterData,{
          pane:'waterAreas',interactive:false,
          style:{color:'#ffffff',weight:.8,opacity:1,fillColor:'#ffffff',fillOpacity:1}
        }),
        L.geoJSON(transportData,{
          pane:'transportRoadCasing',interactive:false,
          filter:feature => feature.properties?.kind === 'road',
          style:{color:'#875510',weight:3.5,opacity:1}
        }),
        L.geoJSON(transportData,{
          pane:'transportRoads',interactive:false,
          filter:feature => feature.properties?.kind === 'road',
          style:{color:'#e3a027',weight:2.1,opacity:1}
        }),
        L.geoJSON(transportData,{
          pane:'transportExpressways',interactive:false,
          filter:feature => feature.properties?.kind === 'expressway',
          style:{color:'#7650a6',weight:3.5,opacity:1,dashArray:'7 4'}
        }),
        L.geoJSON(transportData,{
          pane:'transportRails',interactive:false,
          filter:feature => feature.properties?.kind === 'rail',
          style:feature => ({color:railColors[feature.properties?.name] || '#7b1e3a',weight:2.4,opacity:1})
        }),
        L.geoJSON(townLayer.toGeoJSON(),{
          pane:'boundaryOverlay',interactive:false,
          style:{color:'#ffffff',weight:.85,opacity:1,fill:false}
        }),
        L.geoJSON(stationData,{
          pane:'stationMarkers',interactive:false,
          pointToLayer(feature,latlng) {
            const color = feature.properties?.operator === 'JR' ? '#08743d'
              : feature.properties?.operator?.startsWith('阪急') ? '#67162f' : '#c95216';
            return L.circleMarker(latlng,{pane:'stationMarkers',radius:3.2,color,weight:1.6,fillColor:'#fff',fillOpacity:1});
          },
          onEachFeature(feature,layer) {
            const baseLabel = feature.properties?.label || feature.properties?.name || '';
            const stationLabel = baseLabel.includes('（')
              ? baseLabel.replace('（','駅（')
              : `${baseLabel}駅`;
            layer.bindTooltip(stationLabel,{
              pane:'stationLabels',permanent:true,direction:'top',offset:L.point(0,-2),className:'station-label',interactive:false
            });
          }
        })
      ];
      const transportLabelLayers = TRANSPORT_LABELS.map(label => ({
        ...label,
        at:transportLabelAnchor(transportData,label)
      })).filter(label => label.at).map(label => {
        const defaultOffset = label.direction === 'right' ? [3,0]
          : label.direction === 'left' ? [-3,0]
          : label.direction === 'bottom' ? [0,3]
          : [0,-3];
        const offset = label.offset || defaultOffset;
        return L.tooltip({
          pane:'transportLabels',
          permanent:true,
          direction:label.direction,
          offset:L.point(offset[0],offset[1]),
          className:`transport-label ${label.kind === 'rail' ? 'rail-label' : label.kind === 'expressway' ? 'expressway-label' : ''}`,
          interactive:false
        }).setLatLng(label.at).setContent(label.name);
      });
      transportGroup = L.layerGroup([...transportLayers,...transportLabelLayers]).addTo(map);
      transportVisible = true;
      transportButton.textContent = '白地図に戻る';
      transportButton.setAttribute('aria-pressed', 'true');
      updateTransportLabelScale();
    } catch (error) {
      transportButton.textContent = '交通入りで見る';
      transportButton.setAttribute('aria-pressed', 'false');
      message.textContent = '交通データを読み込めませんでした。もう一度お試しください。';
      console.error(error);
    } finally {
      transportButton.disabled = false;
    }
  }

  Promise.all([
    fetch('data/nishinomiya-towns.topojson').then(response => {
      if (!response.ok) throw new Error('境界データを読み込めませんでした');
      return response.json();
    }),
    fetch('data/community-town-map.json').then(response => {
      if (!response.ok) throw new Error('コミュニティ対応データを読み込めませんでした');
      return response.json();
    })
  ])
    .then(([topology, mapping]) => {
      const townObject = topology.objects.town || topology.objects[Object.keys(topology.objects)[0]];
      const allGeometries = townObject.geometries || [];

      // コミュニティ選択画面と完全に同じ基準で、
      // mapping.communities に列挙された26コミュニティだけを使用する。
      // 「海域」など別分類が community 欄に入っていても描画しない。
      const validCommunities = new Set(mapping.communities || []);
      const geometries = allGeometries.filter(g => {
        const name = rawName(g);
        const community = mapping.towns?.[name]?.community;
        // 白地図で町名を確認では岡田山も通常の1町として扱う。
        return name === '岡田山' || validCommunities.has(community);
      });

      const names = [...new Set(geometries.map(g => groupedName(rawName(g))))];

      const mergedFeatures = names.map(name => {
        const members = geometries.filter(g => groupedName(rawName(g)) === name);
        const merged = topojson.merge(topology, members);
        const communities = [];
        members.forEach(member => {
          const community = mapping.towns?.[rawName(member)]?.community;
          const resolved = community === '1〜3 広田、4〜7 上ヶ原'
            ? ['広田', '上ヶ原']
            : (validCommunities.has(community) ? [community] : []);
          resolved.forEach(item => {
            if (!communities.includes(item)) communities.push(item);
          });
        });
        merged.properties = { S_NAME: name, COMMUNITIES: communities };
        return merged;
      });

      townLayer = L.geoJSON(
        { type:'FeatureCollection', features: mergedFeatures },
        {
          style: normalStyle,
          onEachFeature(feature, layer) {
            const name = featureName(feature);
            layer.bindTooltip(name, { sticky:true, direction:'top', className:'town-tooltip' });
            layer.on({
              click: () => chooseTown(feature, layer),
              mouseover: e => {
                if (name !== selectedName) e.target.setStyle({ fillOpacity:.95, weight:2 });
              },
              mouseout: e => {
                if (name !== selectedName) e.target.setStyle(normalStyle);
              }
            });
          }
        }
      ).addTo(map);

      allBounds = townLayer.getBounds();
      map.fitBounds(allBounds, { padding:[8,8], animate:false });
      initialMapZoom = map.getZoom();
      updateTransportLabelScale();
      transportButton.disabled = false;
      setTimeout(() => map.invalidateSize({animate:false}), 0);
    })
    .catch(error => {
      townMain.textContent = '地図を読み込めませんでした';
      townReading.textContent = '';
      townCommunity.textContent = '';
      message.textContent = '地図データの読み込みに失敗しました。ページをもう一度開いてください。';
      transportButton.disabled = true;
      console.error(error);
    });

  document.getElementById('resetView').addEventListener('click', () => {
    if (allBounds) map.fitBounds(allBounds, { padding:[8,8], animate:false });
  });
  transportButton.addEventListener('click', toggleTransport);
})();
</script>
</body>
</html>
